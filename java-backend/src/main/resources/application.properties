# Spring Boot Application Properties
server.port=8080
spring.application.name=digital-library-management

# Database Configuration (Defaults to in-memory H2 with MySQL syntax for testing, or MySQL)
# To connect to real local MySQL:
# spring.datasource.url=jdbc:mysql://localhost:3306/library_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
# spring.datasource.username=root
# spring.datasource.password=rootpassword
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Default H2 In-Memory DB Mode for instant local test / evaluation:
spring.datasource.url=jdbc:h2:mem:library_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# JPA / Hibernate configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Initial Data Seeding
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:data.sql

# H2 Web Console (accessible at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Fine Rate Configuration
library.fine.rate-per-day=5.0
library.circulation.loan-days=14
